<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Training Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{

margin:0;

padding:0;

font-family:'Poppins',sans-serif;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#4facfe);

background-size:400% 400%;

animation:bg 15s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

.login-container{

width:420px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

padding:40px;

border-radius:25px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

text-align:center;

font-size:65px;

color:white;

margin-bottom:10px;

}

h1{

text-align:center;

color:white;

margin-bottom:5px;

}

.subtitle{

text-align:center;

color:white;

margin-bottom:30px;

font-size:15px;

}

.input-group{

position:relative;

margin-bottom:20px;

}

.input-group i{

position:absolute;

top:16px;

left:15px;

color:#0b5ed7;

font-size:18px;

}

.input-group input,

.input-group select{

width:100%;

padding:14px 14px 14px 45px;

border:none;

border-radius:10px;

outline:none;

font-size:15px;

}

.input-group input:focus,

.input-group select:focus{

box-shadow:0 0 12px #00d4ff;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:linear-gradient(90deg,#0061ff,#00c6ff);

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-3px);

box-shadow:0 10px 20px rgba(0,0,0,.3);

}

.credentials{

margin-top:25px;

background:rgba(255,255,255,.12);

padding:15px;

border-radius:15px;

color:white;

font-size:14px;

}

.credentials h3{

text-align:center;

margin-bottom:15px;

}

.footer{

text-align:center;

margin-top:20px;

color:white;

font-size:13px;

opacity:.9;

}

</style>

</head>

<body>

<div class="login-container">

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

</div>

<h1>Training Management System</h1>

<p class="subtitle">

Digital Employee Learning Portal

</p>

<form action="/login" method="POST">

<div class="input-group">

<i class="fa-solid fa-users"></i>

<select name="role" required>

<option value="">Select Role</option>

<option value="admin">Administrator</option>

<option value="employee">Employee</option>

</select>

</div>

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input

type="text"

name="username"

placeholder="Enter Username"

required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input

type="password"

name="password"

placeholder="Enter Password"

required>

</div>

<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

LOGIN

</button>

</form>

<div class="credentials">

<h3>

<i class="fa-solid fa-key"></i>

Demo Credentials

</h3>

<b>Administrator</b>

<br>

Username : admin

<br>

Password : 1234

<br><br>

<b>Employee</b>

<br>

Username : employee

<br>

Password : emp123

</div>

<div class="footer">

© 2026 Training Management System

<br>

Designed using Flask • HTML • CSS

</div>

</div>

</body>

</html>
