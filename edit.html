<!DOCTYPE html>
<html>

<head>

<title>Edit</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Edit Syllabus</h1>

<form action="/update/{{ id }}" method="post">

<input type="text"
name="department"
value="{{ item.department }}">

<input type="text"
name="title"
value="{{ item.title }}">

<input type="text"
name="folder"
value="{{ item.folder }}">

<button>Update</button>

</form>

</div>

</body>
</html>
